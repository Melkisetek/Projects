<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista Tareas</title>
    <link rel="stylesheet" href="styles/estilos.css" />
  </head>

  <body>
    <div class="header">
      <div class="titulo_principal">Lista De Tareas</div>
      <div class="menuDesplegable">
        <select class="estadoTareas" id="estadoTareas">
          <option value="noCompletada" selected>No Completadas</option>
          <option value="completadas">Completadas</option>
        </select>
      </div>
      <div class="temaInterfaz">
        <input type="radio" name="slider" id="claro" checked />
        <input type="radio" name="slider" id="oscuro" />
        <nav>
          <label for="claro" class="claro">Claro</label>
          <label for="oscuro" class="oscuro">Oscuro</label>
        </nav>
      </div>
    </div>

    <main>
      <form action="" onsubmit="return false;">
        <div class="agregar">
          <button class="btn_agregar" onclick="abrirPopup()" title="Agregar">
            <ion-icon name="add-circle-outline"></ion-icon>
          </button>
          <div class="linea"></div>
          <button class="elemento_eliminar--btn">
            <ion-icon name="trash-outline"></ion-icon>
          </button>
          <input
            rel="nofollow"
            type="text"
            name="titulo"
            id="titulo"
            placeholder="título"
          />
          <input
            type="checkbox"
            name="check"
            class="check"
            id="check"
            title="Marcar Completada"
          />
          <select name="" id="categoria" class="categorias">
            <option value="" disabled selected>Categoría</option>
            <option value="">Tarea</option>
            <option value="">Cocina</option>
            <option value="">Escuela</option>
          </select>
          <input type="datetime-local" name="" id="fechaHora" />
          <button class="elemento_modificar--btn" title="Modificar">
            <ion-icon name="create-outline"></ion-icon>
          </button>
          <br />
          <div class="linea"></div>
        </div>
      </form>
      <!-- Nuevo contenedor para mostrar la lista de tareas-->
      <div class="agregar" id="lista-tareas"></div>
      <section>
        <div class="popup" id="popup">
          <form
            action=""
            onsubmit="return false;"
            class="formulario"
            id="formulario"
          >
            <input
              type="text"
              class="titulo"
              name=""
              id="titulo2"
              placeholder="Título"
            />
            <div class="linea"></div>
            <textarea name="" id="texto" cols="30" rows="10"></textarea>
            <button class="guardar_btn" id="guardar_btn" title="Guadar">
              Guardar
            </button>
            <button class="cerrar" onclick="cerrarPopup()" title="Cerrar">
              <ion-icon name="close-outline"></ion-icon>
            </button>
          </form>
        </div>
        <!-- Fondo oscuro -->
        <div id="overlay" class="overlay"></div>
      </section>
    </main>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <script src="js/pop-up.js"></script>
    <script src="js/Dato.js"></script>
    <script src="js/listado_apuntes.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
