<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista Tareas</title>
    <link rel="stylesheet" href="styles/estilos.css" />
  </head>

  <body>
    <div class="header">
      <div class="titulo_principal">Lista De Tareas</div>
      <div class="menuDesplegable">
        <select class="estadoTareas" id="estadoTareas">
          <option value="noCompletada" selected>No Completadas</option>
          <option value="completadas">Completadas</option>
          <option value="todas">Todas</option>
        </select>
      </div>
      <div class="temaInterfaz">
        <input type="radio" name="slider" id="claro" checked />
        <input type="radio" name="slider" id="oscuro" />
        <nav>
          <label for="claro" class="claro">Claro</label>
          <label for="oscuro" class="oscuro">Oscuro</label>
        </nav>
      </div>
    </div>

    <main>
      <div class="agregar">
        <button class="btn_agregar" onclick="abrirPopup()" title="Agregar">
          <ion-icon name="add-circle-outline"></ion-icon>
        </button>
        <div class="linea"></div>
      </div>
      
      <!-- Contenedor para mostrar la lista de tareas-->
      <div id="lista-tareas"></div>
      
      <section>
        <div class="popup" id="popup">
          <form
            action=""
            onsubmit="return false;"
            class="formulario"
            id="formulario"
          >
            <input
              type="text"
              class="titulo"
              name=""
              id="titulo2"
              placeholder="Título"
              required
            />
            <div class="linea"></div>
            <textarea name="" id="texto" cols="30" rows="10" placeholder="Descripción" required></textarea>
            <button class="guardar_btn" id="guardar_btn" title="Guadar">
              Guardar
            </button>
            <button type="button" class="cerrar" onclick="cerrarPopup()" title="Cerrar">
              <ion-icon name="close-outline"></ion-icon>
            </button>
          </form>
        </div>
        <!-- Fondo oscuro -->
        <div id="overlay" class="overlay"></div>
      </section>
    </main>

    <!-- Scripts para íconos -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    
    <!-- Scripts de la aplicación -->
    <script src="js/pop-up.js"></script>
    <script src="js/Dato.js"></script>
    <script src="js/listado_apuntes.js"></script>
    <script src="js/app.js"></script>
    
    <!-- Script para cambiar el tema -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const claro = document.getElementById('claro');
        const oscuro = document.getElementById('oscuro');
        
        // Cargar tema guardado
        const temaGuardado = localStorage.getItem('tema');
        if (temaGuardado === 'oscuro') {
          document.body.classList.add('tema-oscuro');
          oscuro.checked = true;
        } else {
          claro.checked = true;
        }
        
        // Cambiar tema
        claro.addEventListener('change', function() {
          if (this.checked) {
            document.body.classList.remove('tema-oscuro');
            localStorage.setItem('tema', 'claro');
          }
        });
        
        oscuro.addEventListener('change', function() {
          if (this.checked) {
            document.body.classList.add('tema-oscuro');
            localStorage.setItem('tema', 'oscuro');
          }
        });
      });
    </script>
  </body>
</html>
